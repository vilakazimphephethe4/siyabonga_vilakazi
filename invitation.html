<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Your Invitation 💌</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Floating hearts -->
    <div class="hearts">
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
    </div>

    <main class="card invitation-card">
      <div class="emoji">💌</div>

      <h1>Glad you agreed 😊</h1>

      <p class="intro">Worship 😊</p>

      <p>I'm really looking forward to spending some time with you.</p>

      <div class="invitation-details">
        <div class="detail">
          <span>📅</span>

          <div>
            <strong>Day</strong>
            <p id="invitationDate">Loading...</p>
          </div>
        </div>

        <div class="detail">
          <span>🕐</span>

          <div>
            <strong>Time</strong>
            <p id="invitationTime">Loading...</p>
          </div>
        </div>

        <div class="detail">
          <span>💕</span>

          <div>
            <strong>Plan</strong>
            <p id="invitationPlan">Loading...</p>
          </div>
        </div>

        <div class="detail" id="invitationMessageContainer">
          <span>💬</span>

          <div>
            <strong>Message</strong>

            <p id="invitationMessage">Loading...</p>
          </div>
        </div>
      </div>

      <p class="closing">Looking forward to it 😊❤️</p>

      <p class="signature">Siyabonga Vilakazi</p>
    </main>

    <footer>@Department of Information Technology</footer>

    <div id="celebration"></div>

    <script src="script.js"></script>
  </body>
</html>
