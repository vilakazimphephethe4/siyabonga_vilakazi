<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>A Little Question 💌</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Floating hearts -->
    <div class="hearts">
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
      <span>♡</span>
    </div>

    <main class="card">
      <div class="emoji">💌</div>


      <p class="intro">I think I'm kinda getting addicted to being around you... <b>and guess what? I actually like it.</b></p>

      <p class="question">So I have a little question for you.</p>

      <h2>Would you like to spend more time together?</h2>

      <div class="buttons">
        <button id="yesBtn">Yes</button>

        <button id="noBtn">No</button>
      </div>

      <p id="response"></p>
    </main>

    <footer>Made by Siyabonga Vilakazi</footer>

    <script src="script.js"></script>
  </body>
</html>
